server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: regulaflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  gemini:
    api-key: ${GEMINI_API_KEY:your_gemini_api_key_here}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    fallback-models: gemini-3.5-flash,gemini-3-flash-preview,gemini-3.1-flash-lite,gemini-2.5-flash
  upload:
    dir: ${UPLOAD_DIR:./uploads}

logging:
  level:
    root: INFO
    gov.aicte.regulaflow: DEBUG
