version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: regulaflow-postgres
    environment:
      POSTGRES_DB: regulaflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d regulaflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: regulaflow-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: regulaflow
      DB_USER: postgres
      DB_PASSWORD: postgrespassword
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: regulaflow-ai
    environment:
      PORT: 8000
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: regulaflow-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
